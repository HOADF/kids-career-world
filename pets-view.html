<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр питомцев (SVG)</title>
  <style>
    body {
      font-family: "Comic Sans MS", sans-serif;
      background: #fefefe;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #444;
      margin-bottom: 20px;
    }
    #picker {
      margin: 20px 0;
    }
    #pets-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .pet {
      width: 140px;
      height: 160px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .pet:hover {
      transform: scale(1.05);
    }
    .pet img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .pet span {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>🐾 Просмотр SVG питомцев</h1>
  <p>Выбери папку с SVG-файлами — и я покажу всех питомцев!</p>

  <input type="file" id="picker" webkitdirectory multiple accept=".svg">
  <div id="pets-container"></div>

  <script>
    const picker = document.getElementById('picker');
    const container = document.getElementById('pets-container');

    picker.addEventListener('change', (event) => {
      container.innerHTML = '';
      const files = Array.from(event.target.files).filter(f => f.name.endsWith('.svg'));
      files.sort((a, b) => a.name.localeCompare(b.name, 'ru'));


      if (files.length === 0) {
        container.innerHTML = '<p>😔 В этой папке нет SVG файлов.</p>';
        return;
      }

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'pet';
          div.innerHTML = `<img src="${e.target.result}" alt="${file.name}"><span>${file.name}</span>`;
          container.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
