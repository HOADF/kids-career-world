<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!--
      Слой 1 (самый дальний) сцены панды: небо, солнце и простой
      абстрактный домик питомца вдалеке — приглушённые цвета и
      пониженная непрозрачность читаются как "далеко", перед этим
      слоем встанут ещё дальний бамбук и земля с ближним бамбуком
      (см. panda_bamboo_far.svg и panda_ground_near.svg).
    -->
    <defs>
        <linearGradient id="pandaSky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9FD9F2" />
            <stop offset="100%" stop-color="#E8F7FD" />
        </linearGradient>
    </defs>

    <rect x="0" y="0" width="800" height="600" fill="url(#pandaSky)" />

    <!-- Солнце — в верхнем левом углу, чтобы не спорить с домиком -->
    <circle cx="110" cy="90" r="48" fill="#FFE59A" opacity="0.35" />
    <circle cx="110" cy="90" r="31" fill="#FFE59A" />

    <!-- Абстрактный домик питомца — вдалеке, простыми плоскими формами.
         Сдвинут к правому краю: по центру экрана всегда стоит
         стеклянная карточка игры, а здесь, сбоку от неё, домик
         остаётся на виду (см. расположение .game-card). -->
    <g opacity="0.62">
        <rect x="560" y="320" width="150" height="120" rx="12" fill="#F3DCC4" />
        <path d="M542 320 L635 232 L718 320 Z" fill="#DE9B7E" />
        <circle cx="598" cy="372" r="13" fill="#CDE9F2" stroke="#F3DCC4" stroke-width="5" />
        <circle cx="668" cy="372" r="13" fill="#CDE9F2" stroke="#F3DCC4" stroke-width="5" />
        <rect x="618" y="392" width="30" height="48" rx="5" fill="#B97552" />
    </g>
</svg>
