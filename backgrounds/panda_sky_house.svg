<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!--
      Слой 1 (самый дальний) сцены панды: небо, солнце и простой
      абстрактный домик питомца вдалеке — приглушённые цвета и
      пониженная непрозрачность читаются как "далеко", перед этим
      слоем встанут ещё дальний бамбук и земля с ближним бамбуком
      (см. panda_bamboo_far.svg и panda_ground_near.svg).
    -->
    <defs>
        <linearGradient id="pandaSky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9FD9F2" />
            <stop offset="100%" stop-color="#E8F7FD" />
        </linearGradient>
    </defs>

    <rect x="0" y="0" width="800" height="600" fill="url(#pandaSky)" />

    <!-- Солнце — над домиком, оба в левой части сцены, где сидит
         панда и куда не достаёт стеклянная карточка игры. -->
    <circle cx="260" cy="70" r="42" fill="#FFE59A" opacity="0.35" />
    <circle cx="260" cy="70" r="27" fill="#FFE59A" />

    <!-- Небольшой холм — на границе неба (этот слой) и земли
         (panda_bamboo_far.svg/panda_ground_near.svg рисуются поверх
         снизу), поэтому его верхушка с домиком видна МЕЖДУ небом и
         землёй, как и просили. Специально у самого левого края — это
         единственная зона, которую не закрывает карточка с игрой
         (она широкая и почти во весь экран), а панда сидит как раз
         здесь же, у левого края. -->
    <path d="M0 320 Q90 230 180 320 L180 420 L0 420 Z" fill="#AEDB9A" opacity="0.55" />

    <!-- Абстрактный домик питомца — маленький, на верхушке холма, за
         пандой. -->
    <g opacity="0.85">
        <rect x="55" y="245" width="70" height="55" rx="7" fill="#F3DCC4" />
        <path d="M46 245 L90 200 L134 245 Z" fill="#DE9B7E" />
        <circle cx="78" cy="270" r="8" fill="#CDE9F2" stroke="#F3DCC4" stroke-width="4" />
        <rect x="98" y="277" width="18" height="20" rx="3" fill="#B97552" />
    </g>
</svg>
