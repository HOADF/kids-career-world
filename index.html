<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kids Career World — знакомство</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
  <script type="module" src="script.js"></script>
</head>
<body>

  <main class="page-root">
    
    <section id="welcome-card" class="welcome-card">
      
      <div class="ocean-frame" aria-hidden="true">
        <img src="backgrounds/ocean.svg" class="layer-bg">
        <img src="backgrounds/ocean_floor.svg" class="layer-floor">
        <img src="pets/jellyfish.svg" class="jelly-svg" id="main-pet-image">
      </div>

      <div class="welcome-inner">
        <h1>Привет-привет!</h1>
        <p class="lead">
          Я Медуза — твой добрый помощник 🪼<br>
          Ответь на вопросы, и мы узнаем, какой питомец тебе подходит!
        </p>
        <div class="controls">
          <button id="start-quiz" class="btn-primary">Давай дружить</button>
          <button id="learn-more" class="btn-ghost">Узнать больше</button>
        </div>
      </div>

    </section>

    <section id="questions-section" class="questions-card hidden">
      <div class="ocean-frame">
         <img src="backgrounds/ocean.svg" class="layer-bg" style="filter: blur(5px); opacity: 0.5;">
      </div>
      <div class="questions-inner" style="width: 100%; margin: 0; text-align: center;">
        <div id="progress" class="progress">Вопрос <span id="q-index">1</span> из <span id="q-total">5</span></div>
        <h2 id="question-title">Загружаю вопрос...</h2>
        <div id="answers" class="answers" style="margin: 30px 0;"></div>
        <button id="btn-back" class="btn-ghost small" disabled>◀ Назад</button>
      </div>
    </section>

  </main>

</body>
</html>
