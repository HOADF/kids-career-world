<svg width="160" height="100" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
    <!--
      Пенёк-лежанка — на нём может сидеть любой "наземный" питомец
      (панда и другие в будущем), в отличие от плавающих (медуза),
      которым он не нужен. Общий для всех, не привязан к конкретному
      зверьку — кладётся отдельным слоем под питомца на сцене.
    -->
    <ellipse cx="80" cy="92" rx="66" ry="10" fill="#000000" opacity="0.12" />

    <!-- Тело пенька -->
    <path d="M24 46 Q22 86 34 90 L126 90 Q138 86 136 46 Q138 20 80 16 Q22 20 24 46 Z" fill="#A9734A" />
    <path d="M24 46 Q22 86 34 90 L50 90 Q40 60 44 20 Q30 26 24 46 Z" fill="#8B5A34" opacity="0.6" />

    <!-- Спил сверху с годовыми кольцами -->
    <ellipse cx="80" cy="18" rx="56" ry="16" fill="#D9A066" />
    <ellipse cx="80" cy="18" rx="56" ry="16" fill="none" stroke="#B97E4D" stroke-width="2" />
    <ellipse cx="80" cy="18" rx="40" ry="11" fill="none" stroke="#C98B52" stroke-width="2.4" />
    <ellipse cx="80" cy="18" rx="24" ry="6.5" fill="none" stroke="#C98B52" stroke-width="2.2" />
    <ellipse cx="80" cy="18" rx="9" ry="2.6" fill="none" stroke="#B97E4D" stroke-width="2" />
</svg>
