<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра готовится — Kids Career World</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: system-ui, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #cdeefb 0%, #eafcf2 55%, #d9f2d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .soon-card {
            background: #fffdf7;
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
            border-top: 8px solid var(--bld-color, #ffaa44);
        }

        .soon-portrait {
            font-size: 64px;
            line-height: 1;
            width: 110px;
            height: 110px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, var(--bld-color, #ffe6b3) 120%);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            animation: soonBounce 2.4s ease-in-out infinite;
        }

        @keyframes soonBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .soon-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #2b2b2b;
            margin: 4px 0 2px;
        }

        .soon-building {
            font-size: 0.9rem;
            color: #6b6b6b;
            margin: 0 0 14px;
        }

        .soon-speech {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #3a3a3a;
            margin: 0 0 24px;
        }

        .soon-home {
            display: inline-block;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            background: #ffaa44;
            box-shadow: 0 10px 20px rgba(255, 170, 68, 0.4);
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .soon-home:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="soon-card" id="soon-card">
        <div class="soon-portrait" id="soon-portrait">⏳</div>
        <p class="soon-name" id="soon-name">Этот друг</p>
        <p class="soon-building" id="soon-building"></p>
        <p class="soon-speech" id="soon-speech">
            Я очень хочу поиграть с тобой, но моя игра пока готовится! Загляни ко мне чуть позже — а сейчас пойдём поможем другим зверятам на карте.
        </p>
        <a class="soon-home" href="../city-map.html">🏠 Вернуться на карту</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pet = params.get('pet');
        const emoji = params.get('emoji');
        const color = params.get('color');
        const building = params.get('building');

        if (emoji) document.getElementById('soon-portrait').textContent = emoji;
        if (pet) document.getElementById('soon-name').textContent = pet;
        if (building) document.getElementById('soon-building').textContent = building;
        if (color) document.getElementById('soon-card').style.setProperty('--bld-color', color);

        if (pet) {
            document.getElementById('soon-speech').textContent =
                `Я, ${pet}, очень хочу поиграть с тобой, но моя игра пока готовится! Загляни чуть позже — а сейчас пойдём поможем другим зверятам на карте.`;
        }
    </script>
</body>
</html>
