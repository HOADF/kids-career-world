<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Построй домик</title>
  <link rel="stylesheet" href="builder-game.css">
  <meta name="game-level" content="1">
  <meta name="age-range" content="5–8">
  <meta name="game-title" content="Построй домик">
  <meta name="game-description" content="Собери домик из деталей — игра для малышей.">

</head>
<body>
  <h2 class="game-level">Уровень 1 (5–8 лет)</h2>

  <div class="game-card">

    <!-- Навигация — пути к корню: ../../ -->
    <div class="navigation" aria-label="Навигация">
      <a href="../../index.html" class="nav-btn">🏠 Домой</a>
      <a href="../../pets-select.html" class="nav-btn">🐯 В домик питомца</a>
    </div>

    <h1 class="game-title">🧱 Построй домик</h1>
    <p class="subtitle">Перетащи детали на нужные места</p>

    <!-- Игровая площадка -->
    <div id="playground" aria-label="Площадка для сборки">
      <div id="house-template" aria-hidden="true">
        <!-- зоны принимают только свою деталь по data-part -->
        <div class="dropzone" data-part="roof"></div>
        <div class="dropzone" data-part="wall"></div>
        <div class="dropzone" data-part="door"></div>
        <div class="dropzone" data-part="window"></div>
      </div>

      <div class="pet" aria-hidden="true">
        <!-- путь к питомцу из корня: ../../pets/tiger.svg -->
        <img src="../../pets/tiger.svg" alt="Тигрёнок">
        <div class="pet-name">Тигрёнок</div>
      </div>
    </div>

    <!-- Панель деталей: используем файлы из папки images в games/builder/images/ -->
    <div id="part">
      <img src="images/roof.svg" data-part="roof" draggable="true" alt="Крыша" class="part-roof">
      <img src="images/wall.svg" data-part="wall" draggable="true" alt="Стена" class="part-wall">
      <img src="images/door.svg" data-part="door" draggable="true" alt="Дверь" class="part-door">
      <img src="images/window.svg" data-part="window" draggable="true" alt="Окно" class="part-window">
    </div>


    <p id="status" class="hidden">🎉 Отлично! Дом готов!</p>

    <div class="controls-row">
      <button id="restart" class="nav-btn small">🔁 Сыграть снова</button>
      <a href="../../index.html" class="nav-btn small">🏠 На главную</a>
    </div>

  </div>

  <!-- JS в той же папке -->
  <script src="builder-game.js"></script>
</body>
</html>
