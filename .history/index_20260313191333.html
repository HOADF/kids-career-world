<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kids Career World — знакомство</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="games-list.css">
  <link rel="stylesheet" href="animations.css"> <script type="module" src="script.js"></script>
</head>
<body>

  <div class="ocean-frame" aria-hidden="true">
    <img src="backgrounds/ocean.svg" class="layer-bg">
    <img src="backgrounds/ocean_floor.svg" class="layer-floor">
    
    <img src="pets/jellyfish.svg" class="jelly-svg" id="main-pet-image">
    
    <img src="fx/bubbles.svg" class="bubble-stream stream-left">
    <img src="fx/bubbles.svg" class="bubble-stream stream-right">
  </div>

  <main class="page-root">
    
    <section id="welcome-card" class="welcome-card">
      <div class="welcome-inner" style="padding: 40px; text-align: center;">
        <h1 id="welcome-title">Привет-привет!</h1>
        <p class="lead">
          Я Медуза — твой добрый помощник 🪼<br>
          Помоги мне ответить на вопросы, чтобы понять,<br> 
          какие игры тебе интереснее и какой питомец тебе подойдёт.
        </p>

        <div class="controls" style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
          <button id="start-quiz" class="btn-primary">Давай дружить</button>
          <button id="learn-more" class="btn-ghost">Узнать больше</button>
        </div>
      </div>
    </section>

    <section id="questions-section" class="questions-card hidden">
      <div class="questions-inner">
        <div id="progress" class="progress">Вопрос <span id="q-index">1</span> из <span id="q-total">5</span></div>
        <h2 id="question-title" class="question-title">Загружаю вопрос...</h2>
        <div id="answers" class="answers"></div>
        <div class="nav-row">
          <button id="btn-back" class="btn-ghost small" disabled>◀ Назад</button>
          <button id="btn-next" class="btn-primary small" disabled>Дальше ▶</button>
        </div>
      </div>
    </section>

    <section id="result-section" class="result-card hidden">
      <div class="result-inner">
        <h2 id="result-title">Тебе подойдёт...</h2>
        <div id="result-pet" class="result-pet"></div>
        <div id="result-games" class="result-games"></div>
        <div class="result-controls">
          <button id="restart" class="btn-ghost">Пройти снова</button>
          <button id="continue" class="btn-primary">Пойти в игры</button>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
