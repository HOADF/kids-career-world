<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kids Career World</title>
    <link rel="stylesheet" href="animations.css">
    <script type="module" src="script.js"></script>
</head>
<body>

    <div class="ocean-scene">
        <img src="backgrounds/ocean.svg" class="bg-full">
        <img src="backgrounds/ocean_floor.svg" class="floor-full">
        <img src="fx/bubbles.svg" class="bubbles b-1">
        <img src="fx/bubbles.svg" class="bubbles b-2">
    </div>

    <img src="pets/jellyfish.svg" class="character-jelly" id="main-pet">

    <div class="ui-layer">
        <section id="welcome-card" class="glass-card">
            <h1>Привет-привет!</h1>
            <p>
                Я Медуза — твой добрый помощник 🪼<br>
                Давай ответим на вопросы и выберем тебе питомца!
            </p>
            <div style="margin-top: 30px;">
                <button id="start-quiz" class="btn-main">Давай дружить</button>
                <button id="learn-more" class="btn-secondary">Узнать больше</button>
            </div>
        </section>
    </div>

</body>
</html>
