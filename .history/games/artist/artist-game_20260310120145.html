<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уровень 1 — Пандочка-художник</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="artist-style.css">
</head>
<body>

    <div class="main-card">
        <div class="nav-buttons">
            <button class="btn-nav">🏠 Домой</button>
            <button class="btn-nav">🐹 В домик питомца</button>
        </div>

        <div class="game-header">
            <h1>🎨 Раскрась мир</h1>
            <p>Выбери цвет и нажми на нужную деталь</p>
        </div>

        <div class="game-board">
            <div class="pet-side">
                <img src="../../pets/artist.svg" alt="Пандочка" class="pet-img">
                <span class="pet-name">Пандочка</span>
                <div id="speech-bubble" class="bubble hidden"></div>
            </div>

            <div class="canvas-area">
                <svg viewBox="0 0 200 150" id="paint-svg">
                    <rect id="sky" class="paint-area" data-correct="blue" x="10" y="10" width="180" height="60" rx="10" />
                    <circle id="sun" class="paint-area" data-correct="yellow" cx="160" cy="35" r="15" />
                    <rect id="ground" class="paint-area" data-correct="green" x="10" y="110" width="180" height="30" rx="10" />
                    <rect id="house" class="paint-area" data-correct="red" x="80" y="70" width="40" height="40" />
                    <path id="roof" class="paint-area" data-correct="red" d="M80 70 L100 45 L120 70 Z" />
                </svg>
            </div>
        </div>

        <div class="palette">
            <div class="color-item" id="blue" data-color="blue" data-hex="#4A90E2"></div>
            <div class="color-item" id="yellow" data-color="yellow" data-hex="#FFD700"></div>
            <div class="color-item" id="green" data-color="green" data-hex="#7ED321"></div>
            <div class="color-item" id="red" data-color="red" data-hex="#D0021B"></div>
        </div>

        <div class="bottom-nav">
            <button id="reset-btn" class="btn-action">🔄 Начать заново</button>
            <button id="finish-btn" class="btn-action hidden">🏠 На главную</button>
        </div>
    </div>

    <script src="artist-game.js"></script>
</body>
</html>
