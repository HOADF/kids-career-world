<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уровень 1 — Пандочка-художник</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="artist-style.css">
</head>
<body>

<div class="main-card">
    <div class="nav-buttons">
        <button class="btn-nav">🏠 Домой</button>
        <button class="btn-nav">🐹 В домик питомца</button>
    </div>

    <h1>🎨 Раскрась мир</h1>

    <div class="game-board">
        <div class="pet-side">
            <div id="speech-bubble" class="bubble hidden"></div> 
            <img src="../../pets/panda.svg" alt="Panda" class="pet-img">
            <p class="pet-name">Пандочка</p>
        </div>

        <div class="canvas-area">
            <svg viewBox="0 0 200 150" id="paint-svg">
                <rect id="sky" class="paint-area" data-correct="blue" data-name="Небо" x="0" y="0" width="200" height="100" />
                
                <rect id="ground" class="paint-area" data-correct="green" data-name="Травка" x="0" y="100" width="200" height="50" />
                
                <g id="sun-group" class="paint-area" data-correct="yellow" data-name="Солнышко">
                    <circle cx="160" cy="30" r="15" />
                    <line x1="160" y1="8" x2="160" y2="2" stroke-width="2" stroke-linecap="round" />
                    <line x1="160" y1="52" x2="160" y2="58" stroke-width="2" stroke-linecap="round" />
                    <line x1="138" y1="30" x2="132" y2="30" stroke-width="2" stroke-linecap="round" />
                    <line x1="182" y1="30" x2="188" y2="30" stroke-width="2" stroke-linecap="round" />
                    <line x1="145" y1="15" x2="141" y2="11" stroke-width="2" stroke-linecap="round" />
                    <line x1="175" y1="45" x2="179" y2="49" stroke-width="2" stroke-linecap="round" />
                </g>

                <rect id="house" class="paint-area" data-correct="brown" data-name="Стены" x="75" y="70" width="50" height="30" rx="5" ry="5" />
                
                <path id="roof" class="paint-area" data-correct="red" data-name="Крыша" d="M70 70 L100 40 L130 70 Z" stroke-linejoin="round" />
            </svg>
        </div>
    </div>

    <div class="palette">
        <div class="color-item" id="blue" data-color="blue" data-hex="#4A90E2" style="background-color: #4A90E2;"></div>
        <div class="color-item" id="yellow" data-color="yellow" data-hex="#FFD700" style="background-color: #FFD700;"></div>
        <div class="color-item" id="green" data-color="green" data-hex="#7ED321" style="background-color: #7ED321;"></div>
        <div class="color-item" id="brown" data-color="brown" data-hex="#8B4513" style="background-color: #8B4513;"></div>
        <div class="color-item" id="red" data-color="red" data-hex="#FF595E" style="background-color: #FF595E;"></div>
    </div>

    <div class="bottom-nav">
        <button onclick="location.reload()" class="btn-action">🔄 Начать заново</button>
        <button id="finish-btn" class="btn-action hidden">🏠 На главную</button>
    </div>
</div>

<script src="artist-game.js"></script>
</body>
</html>
