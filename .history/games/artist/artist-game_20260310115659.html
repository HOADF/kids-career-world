<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пандочка-художник — Логика</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="artist-style.css">
</head>
<body>

    <div class="game-wrapper">
        <header class="game-header">
            <h2>Раскрась мир правильно! 🎨</h2>
        </header>

        <main class="game-area">
            <div id="canvas-container">
                <svg id="paint-svg" viewBox="0 0 200 150">
                    <rect id="sky" class="paint-area" data-correct="blue" data-name="Небо" x="0" y="0" width="200" height="100" fill="#f0f0f0" />
                    <circle id="sun" class="paint-area" data-correct="yellow" data-name="Солнышко" cx="170" cy="30" r="15" fill="#f0f0f0" />
                    <rect id="ground" class="paint-area" data-correct="green" data-name="Травка" x="0" y="100" width="200" height="50" fill="#f0f0f0" />
                    <rect id="trunk" class="paint-area" data-correct="brown" data-name="Ствол" x="35" y="85" width="8" height="25" fill="#f0f0f0" />
                    <circle id="tree" class="paint-area" data-correct="green" data-name="Дерево" cx="39" cy="75" r="22" fill="#f0f0f0" />
                    <rect id="house" class="paint-area" data-correct="red" data-name="Домик" x="100" y="75" width="40" height="35" fill="#f0f0f0" />
                    <path id="roof" class="paint-area" data-correct="red" data-name="Крыша" d="M100 75 L120 45 L140 75 Z" fill="#f0f0f0" />
                </svg>
            </div>

            <div class="palette">
                <div class="color-drop" id="blue" style="background: #1982C4;" data-color="blue" data-hex="#1982C4"></div>
                <div class="color-drop" id="yellow" style="background: #FFCA3A;" data-color="yellow" data-hex="#FFCA3A"></div>
                <div class="color-drop" id="green" style="background: #8AC926;" data-color="green" data-hex="#8AC926"></div>
                <div class="color-drop" id="brown" style="background: #8B4513;" data-color="brown" data-hex="#8B4513"></div>
                <div class="color-drop" id="red" style="background: #FF595E;" data-color="red" data-hex="#FF595E"></div>
            </div>
        </main>

        <div class="mentor-container">
            <div id="speech-bubble" class="hidden">Привет! Давай рисовать!</div>
            <div class="pet-svg-wrapper">
                <svg id="panda-pet" width="100" height="100" viewBox="0 0 96 96">
                    <circle cx="48" cy="48" r="44" fill="#FFF8F0"/>
                    <circle cx="30" cy="30" r="10" fill="#333"/> <circle cx="66" cy="30" r="10" fill="#333"/> <circle cx="48" cy="55" r="35" fill="#fff" stroke="#333" stroke-width="2"/> <circle id="eye-l" cx="38" cy="50" r="5" fill="#333"/> <circle id="eye-r" cx="58" cy="50" r="5" fill="#333"/> <path id="mouth" d="M44 65 Q48 68 52 65" stroke="#333" stroke-width="2" fill="none"/> </svg>
            </div>
        </div>

        <button id="finish-btn">Красота! ✨</button>
    </div>

    <script src="artist-game.js"></script>
</body>
</html>
