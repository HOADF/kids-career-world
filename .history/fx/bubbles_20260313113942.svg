<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 800">

  /* КОММЕНТАРИЙ: 1. Набор Пузырьков. Разбросаны по высоте (cy) от 100 до 800. */
  /* cx="30" - левее, cx="70" - правее. r - размер. opacity - прозрачность. */
  
  <circle cx="50" cy="150" r="8" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <circle cx="20" cy="250" r="5" fill="white" opacity="0.4" stroke="white" stroke-width="1"/>
  <circle cx="80" cy="300" r="10" fill="white" opacity="0.5" stroke="white" stroke-width="1"/>
  <circle cx="40" cy="400" r="6" fill="white" opacity="0.3" stroke="white" stroke-width="1"/>
  <circle cx="60" cy="450" r="9" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>
  <circle cx="10" cy="550" r="4" fill="white" opacity="0.4" stroke="white" stroke-width="1"/>
  <circle cx="90" cy="600" r="7" fill="white" opacity="0.5" stroke="white" stroke-width="1"/>
  <circle cx="30" cy="700" r="11" fill="white" opacity="0.7" stroke="white" stroke-width="1"/>
  <circle cx="70" cy="750" r="5" fill="white" opacity="0.3" stroke="white" stroke-width="1"/>
  <circle cx="50" cy="800" r="8" fill="white" opacity="0.6" stroke="white" stroke-width="1"/>

</svg>